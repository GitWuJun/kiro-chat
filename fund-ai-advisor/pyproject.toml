[project]
name = "fund-advisor"
version = "0.1.0"
description = "AI-assisted decision support for Chinese open-end mutual funds"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "akshare>=1.13",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "chinese-calendar>=1.10",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
tushare = ["tushare>=1.3"]

[project.scripts]
fund-advisor-server = "fund_advisor.server:main"
fund-advisor = "fund_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
